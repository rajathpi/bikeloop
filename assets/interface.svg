<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="Illustration of the Loop interface: a map showing five candidate cycling loops, with a panel listing each by distance">
  <defs>
    <clipPath id="frame"><rect width="900" height="520" rx="20"/></clipPath>
    <clipPath id="mapclip"><rect y="52" width="900" height="268"/></clipPath>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111418" stop-opacity=".95"/>
      <stop offset="1" stop-color="#111418" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#frame)" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    <rect width="900" height="520" fill="#111418"/>

    <!-- map -->
    <g clip-path="url(#mapclip)">
      <rect y="52" width="900" height="268" fill="#0b0e11"/>
      <g stroke="#1c232c" stroke-width="1.5" fill="none">
        <path d="M-20 120 H920 M-20 210 H920 M-20 290 H920 M120 40 V330 M300 40 V330 M480 40 V330 M660 40 V330 M810 40 V330"/>
      </g>
      <g stroke="#232c37" stroke-width="3" fill="none" opacity=".9">
        <path d="M-20 168 C 180 150, 320 200, 500 172 S 780 130, 920 158"/>
        <path d="M215 40 C 240 130, 200 220, 250 330"/>
        <path d="M640 40 C 620 140, 700 210, 665 330"/>
      </g>
      <path d="M-20 250 C 200 240, 300 268, 460 262 S 760 288, 920 272" stroke="#1d3a4d" stroke-width="7" fill="none" opacity=".8"/>

      <!-- candidate loops, all starting and ending at the home pin -->
      <g fill="none" stroke-linecap="round">
        <path d="M450 268 C352 260 288 212 295 160 C302 106 372 72 452 70 C536 68 610 106 614 160 C618 216 548 260 450 268 Z" stroke="#a78bfa" stroke-width="3" opacity=".38"/>
        <path d="M450 268 C372 264 310 232 312 192 C314 150 372 120 434 118 C494 116 540 142 544 180 C548 222 512 262 450 268 Z" stroke="#f472b6" stroke-width="3" opacity=".38"/>
        <path d="M450 268 C400 264 368 240 372 212 C376 180 420 158 476 158 C536 158 584 184 586 216 C588 250 526 268 450 268 Z" stroke="#fbbf24" stroke-width="3" opacity=".38"/>
        <path d="M450 268 C398 262 362 236 366 206 C370 176 404 154 450 152 C498 150 538 172 541 204 C544 238 504 262 450 268 Z" stroke="#60a5fa" stroke-width="3" opacity=".38"/>
        <!-- selected -->
        <path d="M450 268 C380 262 331 224 336 184 C341 142 392 112 450 110 C512 108 566 140 570 184 C574 228 522 262 450 268 Z" stroke="#4ade80" stroke-width="5"/>
      </g>

      <!-- home pin -->
      <circle cx="450" cy="268" r="11" fill="#4ade80" opacity=".22"/>
      <circle cx="450" cy="268" r="5.5" fill="#4ade80" stroke="#0b0e11" stroke-width="2.5"/>

      <rect y="52" width="900" height="46" fill="url(#fade)"/>
    </g>

    <!-- top bar -->
    <text x="20" y="34" fill="#eef2f7" font-size="17" font-weight="650">Loop<tspan fill="#4ade80">.</tspan></text>
    <g transform="translate(806 11)">
      <rect width="38" height="38" rx="11" fill="#1a1f26" stroke="#2b323c"/>
      <text x="19" y="25" fill="#eef2f7" font-size="16" text-anchor="middle">◎</text>
    </g>
    <g transform="translate(852 11)">
      <rect width="38" height="38" rx="11" fill="#1a1f26" stroke="#2b323c"/>
      <text x="19" y="25" fill="#eef2f7" font-size="15" text-anchor="middle">⚙</text>
    </g>

    <!-- bottom sheet -->
    <path d="M0 320 h900 v200 h-900 z" fill="#1a1f26"/>
    <path d="M0 338 q0 -18 18 -18 h864 q18 0 18 18" fill="#1a1f26" stroke="#2b323c" stroke-width="1"/>
    <rect y="320" width="900" height="200" fill="#1a1f26"/>
    <line x1="0" y1="320" x2="900" y2="320" stroke="#2b323c"/>

    <!-- distance chips -->
    <g font-size="13.5" font-weight="550" text-anchor="middle">
      <g><rect x="20" y="338" width="62" height="32" rx="16" fill="none" stroke="#2b323c"/><text x="51" y="359" fill="#93a0b4">10 km</text></g>
      <g><rect x="90" y="338" width="62" height="32" rx="16" fill="none" stroke="#2b323c"/><text x="121" y="359" fill="#93a0b4">20 km</text></g>
      <g><rect x="160" y="338" width="62" height="32" rx="16" fill="none" stroke="#2b323c"/><text x="191" y="359" fill="#93a0b4">30 km</text></g>
      <g><rect x="230" y="338" width="62" height="32" rx="16" fill="#4ade80"/><text x="261" y="359" fill="#062b14" font-weight="700">50 km</text></g>
      <g><rect x="300" y="338" width="62" height="32" rx="16" fill="none" stroke="#2b323c"/><text x="331" y="359" fill="#93a0b4">75 km</text></g>
      <g><rect x="370" y="338" width="66" height="32" rx="16" fill="none" stroke="#2b323c"/><text x="403" y="359" fill="#93a0b4">100 km</text></g>
    </g>

    <!-- result cards -->
    <text x="20" y="399" fill="#93a0b4" font-size="11.5" letter-spacing="1.4">5 LOOPS NEAR 50 KM</text>

    <g transform="translate(20 410)">
      <rect width="420" height="52" rx="13" fill="#17241c" stroke="#4ade80"/>
      <rect x="12" y="9" width="9" height="34" rx="4.5" fill="#4ade80"/>
      <text x="34" y="27" fill="#eef2f7" font-size="17" font-weight="700">50.6 km</text>
      <text x="34" y="43" fill="#93a0b4" font-size="12.5">climb 354 m</text>
      <text x="406" y="25" fill="#93a0b4" font-size="12" text-anchor="end">+0.6 km</text>
      <text x="406" y="40" fill="#93a0b4" font-size="12" text-anchor="end">vs target</text>
    </g>

    <g transform="translate(460 410)">
      <rect width="420" height="52" rx="13" fill="#161b22" stroke="#2b323c"/>
      <rect x="12" y="9" width="9" height="34" rx="4.5" fill="#60a5fa"/>
      <text x="34" y="27" fill="#eef2f7" font-size="17" font-weight="700">48.2 km</text>
      <text x="34" y="43" fill="#93a0b4" font-size="12.5">climb 337 m</text>
      <text x="406" y="25" fill="#93a0b4" font-size="12" text-anchor="end">−1.8 km</text>
      <text x="406" y="40" fill="#93a0b4" font-size="12" text-anchor="end">vs target</text>
    </g>

    <!-- actions -->
    <g transform="translate(20 474)">
      <rect width="420" height="34" rx="12" fill="#161b22" stroke="#2b323c"/>
      <text x="210" y="22" fill="#eef2f7" font-size="13.5" font-weight="600" text-anchor="middle">Save GPX</text>
    </g>
    <g transform="translate(460 474)">
      <rect width="420" height="34" rx="12" fill="#4ade80"/>
      <text x="210" y="22" fill="#062b14" font-size="13.5" font-weight="700" text-anchor="middle">Send to phone app</text>
    </g>
  </g>
</svg>
